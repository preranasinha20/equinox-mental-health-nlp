name: Equinox CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q app.py aura.py ingest.py nlp_bert.py personality.py

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate GitHub Actions workflow YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          root = pathlib.Path(".github/workflows")
          files = sorted(list(root.glob("*.yml")) + list(root.glob("*.yaml")))
          if not files:
              raise SystemExit("No workflow files found")
          for path in files:
              with path.open() as handle:
                  docs = list(yaml.safe_load_all(handle))
              if not docs or all(doc is None for doc in docs):
                  raise SystemExit(f"{path} is empty")
              print(f"OK {path}")
          PY
