```yaml
name: Equinox CD

on:
  workflow_run:
    workflows: ["Equinox CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/equinox_deploy
          chmod 600 ~/.ssh/equinox_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy tested commit to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          ssh -i ~/.ssh/equinox_deploy \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -eu
          cd /home/ubuntu/equinox-mental-health-nlp

          git fetch origin "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"

          sudo systemctl restart equinox
          sudo systemctl is-active --quiet equinox

          for attempt in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              echo "Deployment successful: $DEPLOY_SHA"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed after deployment."
          sudo journalctl -u equinox -n 50 --no-pager
          exit 1
          REMOTE
```
